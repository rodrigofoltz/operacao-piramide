<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Operação Pirâmide</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game-container">
    <!-- Cabeçalho -->
    <div id="ui-header">
        <h1>OPERAÇÃO PIRÂMIDE: FUJA DO VILÃO!</h1>
    </div>

    <!-- Estrutura da Pirâmide -->
    <div id="pyramid">
        <div class="row" id="row-4">
            <div class="block"><input type="number" id="block-4-1" /></div>
        </div>
        <div class="row" id="row-3">
            <div class="block"><input type="number" id="block-3-1" /></div>
            <div class="block"><input type="number" id="block-3-2" /></div>
        </div>
        <div class="row" id="row-2">
            <div class="block"><input type="number" id="block-2-1" /></div>
            <div class="block"><input type="number" id="block-2-2" /></div>
            <div class="block"><input type="number" id="block-2-3" /></div>
        </div>
        <div class="row" id="row-1">
            <!-- Valores fixos da base (serão gerados aleatoriamente pelo JS depois) -->
            <div class="block base-block" id="block-1-1">5</div>
            <div class="block base-block" id="block-1-2">2</div>
            <div class="block base-block" id="block-1-3">7</div>
            <div class="block base-block" id="block-1-4">1</div>
        </div>
    </div>

    <!-- Personagens (Substitua o 'src' pelos nomes reais dos seus arquivos de imagem) -->
    <img src="aventureiro_idle.png" id="adventurer" class="character" alt="Aventureiro">
    <img src="vilao_escalando.png" id="villain" class="character" alt="Múmia">

    <!-- Controles -->
<!-- ... seu código anterior ... -->
    <div id="controls">
        <button id="verify-btn">Verificar Respostas</button>
    </div>

    <!-- NOVA TELA DE COMEMORAÇÃO (Oculta por padrão) -->
    <div id="celebration-screen">
        <img src="aventureiro_comemorando.png" alt="Aventureiro Comemorando Vitória">
        <h2>VOCÊ ESCAPOU!</h2>
    </div>
</div>
<!-- ... sua tela de comemoração ... -->

    <!-- NOVA TELA DE DERROTA (Oculta por padrão) -->
    <div id="game-over-screen">
        <img src="mumia_pegou.png" alt="A múmia te pegou!">
        <h2>FIM DE JOGO</h2>
        <p>A múmia te alcançou...</p>
        <button id="restart-btn" onclick="location.reload()">Tentar Novamente</button>
    </div>

</div> <!-- Fechamento do game-container -->

<script src="script.js"></script> <!-- ADICIONE ESTA LINHA AQUI -->
</body>
</html>
